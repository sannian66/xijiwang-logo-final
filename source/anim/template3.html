<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>西几王传媒 · Logo Motion v3</title>
<style>
  /* ——— 设计令牌 ———
     缓动参考 Material 3 Emphasized 与 Apple 的 ease-out-expo：快起、长尾、无回弹 */
  :root {
    --ink: #1d1f1e; --bg: #f5f5f7;
    --emph:  cubic-bezier(.2, 0, 0, 1);      /* Material emphasized */
    --decel: cubic-bezier(.05, .7, .1, 1);   /* emphasized decelerate */
    --expo:  cubic-bezier(.16, 1, .3, 1);    /* Apple-style ease-out-expo */
    --soft:  cubic-bezier(.4, 0, .2, 1);
  }
  body.dark { --ink: #f5f5f7; --bg: #000; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: var(--bg); display: grid; place-items: center; transition: background .5s var(--soft);
         font-family: -apple-system, "SF Pro Text", "Google Sans", system-ui, sans-serif; }
  .stage { width: min(80vw, 980px); }
  svg { width: 100%; height: auto; display: block; overflow: visible; }
  svg * { transform-box: fill-box; transform-origin: center; }
  .ink { fill: var(--ink); }
  svg g[transform] { transform-box: view-box; transform-origin: 0 0; }

  /* 0 · 开场：暂停按钮 */
  .ring    { fill: none; stroke: var(--ink); stroke-width: 1.6; stroke-dasharray: 1;
             animation: draw .9s var(--soft) 0s both, ringOut .9s var(--emph) 1.9s both; }
  .btn     { animation: btnIn .7s var(--decel) .2s both, btnShrink .75s var(--emph) 1.9s both, fadeOut .18s linear 2.6s both; }
  .press   { animation: press .32s var(--soft) 1.33s both; }
  .ripple  { fill: var(--ink); opacity: 0; animation: ripple .8s var(--decel) 1.36s both; }
  .bar     { stroke: var(--ink); stroke-width: 3; stroke-linejoin: round; }
  .barL    { animation: morphL .5s var(--emph) 1.45s both; }
  .barR    { animation: morphR .5s var(--emph) 1.45s both; }
  .cursor  { animation: cursorIn .7s var(--emph) .6s both, cursorOut .45s var(--soft) 1.6s forwards; }
  .cursor .tap { animation: tap .26s var(--soft) 1.3s both; }
  svg g.press, svg g.btn, svg g.tap, svg g.cursor, svg circle.ripple, svg circle.ring { transform-box: view-box; transform-origin: 0 0; }

  /* 1 · 狮子围绕鼻子生长 */
  .lockup  { transform-box: view-box; transform-origin: 135px 126px;
             animation: center 1.2s var(--emph) 3.5s both; }
  .outline { fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-dasharray: 1; stroke-linecap: round;
             animation: draw 1.15s var(--soft) 2.05s both, fadeOut .5s var(--soft) 3.0s both; }
  .mane    { animation: fadeIn .55s var(--soft) 2.85s both; }
  .nose    { animation: fadeIn .18s linear 2.6s both; }
  .eyes    { animation: eyesOpen .6s var(--decel) 3.1s both, blink .32s var(--soft) 6.0s 1; }
  .mouth   { transform-origin: 50% 0; animation: mouthIn .6s var(--decel) 3.3s both; }

  /* 2 · 字标 */
  .zh { animation: rise .95s var(--expo) calc(4.05s + var(--i) * .065s) both; }
  .en { animation: track 1.1s var(--expo) calc(4.45s + var(--i) * .028s) both; }
  .shine { animation: shine 1.3s var(--soft) 5.2s both; }

  @keyframes ringOut  { from { transform: scale(1); opacity: 1; } to { transform: scale(1.65); opacity: 0; } }
  @keyframes btnIn    { from { transform: scale(1.6); opacity: 0; } to { transform: scale(1.9); opacity: 1; } }
  @keyframes btnShrink{ from { transform: scale(1.9); } to { transform: scale(.9); } }
  @keyframes press    { 0%,100% { transform: scale(1); } 40% { transform: scale(.92); } }
  @keyframes ripple   { from { transform: scale(.2); opacity: .14; } to { transform: scale(1.25); opacity: 0; } }
  @keyframes morphL   { from { d: path("M-11.5 -13 L-3.5 -13 L-3.5 13 L-11.5 13 Z"); }
                        to   { d: path("M-13.5 -12.5 L0 -6.25 L0 6.25 L-13.5 12.5 Z"); } }
  @keyframes morphR   { from { d: path("M3.5 -13 L11.5 -13 L11.5 13 L3.5 13 Z"); }
                        to   { d: path("M-0.5 -6.25 L13.5 0 L13.5 0 L-0.5 6.25 Z"); } }
  @keyframes cursorIn { from { transform: translate(150px, 70px); opacity: 0; } 30% { opacity: 1; } to { transform: translate(0, 0); opacity: 1; } }
  @keyframes cursorOut{ from { transform: translate(0,0); opacity: 1; } to { transform: translate(40px, 30px); opacity: 0; } }
  @keyframes tap      { 0%,100% { transform: scale(1); } 45% { transform: scale(.82); } }
  @keyframes draw    { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
  @keyframes fadeIn  { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
  @keyframes settle  { from { transform: scale(1.12); } to { transform: scale(1); } }
  @keyframes center  { from { transform: translateX(256px); } to { transform: translateX(0); } }
  @keyframes eyesOpen { from { transform: scaleY(0); opacity: 0; } to { transform: scaleY(1); opacity: 1; } }
  @keyframes blink   { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(.08); } }
  @keyframes noseIn  { from { transform: translateX(-6px) scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes mouthIn { from { transform: scaleX(.2); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes rise    { from { transform: translateY(105%); } to { transform: translateY(0); } }
  @keyframes track   { from { transform: translateX(calc((var(--i) - 6) * 7px)); opacity: 0; filter: blur(3px); }
                       to   { transform: none; opacity: 1; filter: blur(0); } }
  @keyframes shine   { from { transform: translateX(-180px) skewX(-18deg); } to { transform: translateX(980px) skewX(-18deg); } }

  .controls { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px;
              padding: 6px; border-radius: 999px; background: color-mix(in srgb, var(--ink) 6%, transparent);
              backdrop-filter: blur(20px); }
  .controls button { font: 500 13px/1 inherit; letter-spacing: .01em; padding: 10px 18px; border: 0; border-radius: 999px;
                     background: transparent; color: var(--ink); cursor: pointer; transition: background .2s; }
  .controls button:hover { background: color-mix(in srgb, var(--ink) 10%, transparent); }
  body.capture .controls { display: none; }
  body.capture .stage { width: 51vw; }
  @media (prefers-reduced-motion: reduce) { svg * { animation-duration: .01s !important; animation-delay: 0s !important; } }
</style>
</head>
<body>
<div class="stage">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 782 256" role="img" aria-label="西几王传媒 XIJIWANG MEDIA">
  <defs>
    <linearGradient id="shineGrad" x1="0" x2="1">
      <stop offset="0"  stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1"  stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="zhWindow"><rect x="-10" y="-4" width="500" height="96"/></clipPath>
    <clipPath id="zhShape">{{ZHCLIP}}</clipPath>
    <clipPath id="maneShape"><path clip-rule="evenodd" d="{{MANE}}"/></clipPath>
  </defs>

  <!-- 徽标 + 开场按钮 -->
  <g class="lockup">
    <g class="ink" transform="translate(20 14) scale(.9)">
      <path class="outline" pathLength="1" d="{{MANE}}"/>
      <path class="mane" fill-rule="evenodd" d="{{MANE}}"/>
      <path class="eyes" d="{{EYES}}"/>
      <path class="nose" d="{{NOSE}}"/>
      <path class="mouth" d="{{MOUTH}}"/>
      <g clip-path="url(#maneShape)"><rect class="shine" x="0" y="0" width="80" height="260" fill="url(#shineGrad)"/></g>
    </g>
    <!-- 按钮中心 = 鼻子中心 (20+.9*131.5, 14+.9*147) -->
    <g transform="translate(138.35 146.3)">
      <circle class="ripple" r="58"/>
      <g class="press">
        <g transform="rotate(-90)"><circle class="ring" r="58" pathLength="1"/></g>
        <g class="btn ink">
          <path class="bar barL" d="M-11.5 -13 L-3.5 -13 L-3.5 13 L-11.5 13 Z"/>
          <path class="bar barR" d="M3.5 -13 L11.5 -13 L11.5 13 L3.5 13 Z"/>
        </g>
      </g>
      <!-- 鼠标指针，尖端落在按钮中心偏右下 -->
      <g transform="translate(4 6)">
        <g class="cursor"><g class="tap">
          <path transform="scale(1.6)" d="M0 0 L0 17.5 L4.3 13.5 L7.2 20.2 L10 19 L7.1 12.4 L12.8 12.4 Z"
                fill="#fff" stroke="#111" stroke-width="1.1" stroke-linejoin="round"/>
        </g></g>
      </g>
    </g>
  </g>

  <!-- 中文字标 -->
  <g class="ink" transform="translate(274 61)">
    <g clip-path="url(#zhWindow)">
{{ZH}}
    </g>
    <g clip-path="url(#zhShape)"><rect class="shine" style="animation-delay:3.5s" x="0" y="-10" width="80" height="110" fill="url(#shineGrad)"/></g>
  </g>

  <!-- 英文字标 -->
  <g class="ink" transform="translate(274 167.9937)">
{{EN}}
  </g>
</svg>
</div>

<div class="controls">
  <button id="replay">重播</button>
  <button id="theme">浅色 / 深色</button>
</div>

<script>
  const replay = () => document.getAnimations().forEach(a => { a.cancel(); a.play(); });
  document.getElementById('replay').onclick = replay;
  document.getElementById('theme').onclick = () => document.body.classList.toggle('dark');
  // 逐帧导出用：seek(毫秒)
  window.seek = ms => document.getAnimations().forEach(a => { a.pause(); a.currentTime = ms; });
  if (location.hash === '#dark') document.body.classList.add('dark');
</script>
</body>
</html>
