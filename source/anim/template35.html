<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>西几王传媒 · Logo Motion v3.5</title>
<style>
  /* 缓动：Material 3 Emphasized + Apple ease-out-expo，无回弹 */
  :root {
    --ink: #202624; --bg: #ffffff;
    --emph:  cubic-bezier(.2, 0, 0, 1);
    --decel: cubic-bezier(.05, .7, .1, 1);
    --expo:  cubic-bezier(.16, 1, .3, 1);
    --soft:  cubic-bezier(.4, 0, .2, 1);
  }
  body.dark { --ink: #f5f5f7; --bg: #000000; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: var(--bg); display: grid; place-items: center; transition: background .5s var(--soft);
         font-family: -apple-system, "SF Pro Text", "Google Sans", system-ui, sans-serif; }
  body.capture { transition: none; }
  .stage { width: min(80vw, 980px); }
  svg { width: 100%; height: auto; display: block; overflow: visible; }
  svg * { transform-box: view-box; transform-origin: 0 0; }
  .ink { fill: var(--ink); }

  /* ── 0 · 暂停按钮（镜头 2.8× 对准鼻子） ── */
  .cam     { transform-origin: 138.35px 146.3px; animation: cam 1.6s var(--emph) 1.9s both; }
  .ring    { fill: none; stroke: var(--ink); stroke-width: 1.6; stroke-dasharray: 1.02 1.02; stroke-linecap: round;
             animation: draw .9s var(--soft) 0s both, cut .001s linear {{RINGOFF}}s forwards; }
  .ringwrap{ animation: ringGrow 1.6s var(--emph) 1.9s forwards; }   /* 与镜头同曲线同时长 → 屏幕上环径单调缩小；v3.3: 仅缩放、不平移，环心始终 = 鼻心 = ▶ 中心 */
  .btn     { animation: btnIn .7s var(--decel) .2s both, btnShrink .4s var(--emph) 1.8s forwards, cut .001s linear 2.2s forwards; }   /* v3.3: 2.20s 与狮鼻精确交接 */
  .press   { animation: press .32s var(--soft) 1.28s forwards; }
  .ripple  { fill: var(--ink); opacity: 0; animation: ripple .8s var(--decel) 1.40s forwards; }
  .barL    { animation: cut .001s linear 2.05s forwards; }   /* 形变由 JS 逐帧设置 d 属性（Safari 不支持 CSS d:path()） */
  .barR    { display: none; }   /* v3.4: 两半合并为同一 path（同向绕行，nonzero），合拢帧不再出现双边抗锯齿细缝 */
  /* v3.3: 形变 1.45–2.05s（.6s）。两半在 2.05s 精确合拢后，硬切为同一几何的整体鼻子路径（无接缝） */
  .bnose   { opacity: 0; animation: on .001s linear 2.05s forwards; }
  .cursor  { opacity: 0; animation: cursorIn .7s var(--emph) .55s forwards, cursorOut .35s var(--soft) 1.42s forwards; }
  .cursor .tap { animation: tap .26s var(--soft) 1.30s forwards; }

  /* ── 1 · 狮子：鼻子硬切 + 圆环弯成鬃毛轮廓、再向内加粗成实心狮子（v3.5） ── */
  .lockup  { animation: center 1.0s var(--emph) 3.3s both; }
  .nose    { animation: hold0 2.2s linear 0s, cut .001s linear 3.3s forwards; }
  .reveal  { animation: cut .001s linear 3.3s forwards; }   /* v3.5: 无缩放、无淡入；由 #thick 遮罩“描边加粗”揭示 */
  .feat    { opacity: 0; animation: fadeIn .14s cubic-bezier(.2,0,0,1) 2.4s forwards, cut .001s linear 3.3s forwards; }   /* v3.5: 五官在轮廓加粗到面部边缘时整体淡入，不被波前切成碎片 */
  .outline { fill: none; stroke: var(--ink); stroke-linejoin: round; }   /* v3.5: 圆环 2.00s 交接给它，径向变形为鬃毛外轮廓 */
  /* 展开完成后换回源 SVG 的原始三条路径（结构与源文件一致） */
  .lionAll { opacity: 0; animation: on .001s linear 3.3s forwards; }            /* 3.3s 前隐藏，之后可见 */
  /* v3.5: 圆环 → 鬃毛外轮廓（2.00–2.45s，emph，以鼻心为极点径向插值，轮廓对鼻心星形、无交叉）；2.20s 起轮廓线向内“加粗”成实心鬃毛（遮罩描边宽 w0→220，cubic(.4,0,.1,1) .7s），最后到达五官 */

  /* ── 2 · 字标 ── */
  .zh { animation: rise .95s var(--expo) calc(3.8s + var(--i) * .065s) both, cut .001s linear 5.02s forwards; }
  .en { animation: track 1.1s var(--expo) calc(4.15s + var(--i) * .028s) both, cut .001s linear 5.6s forwards; }
  /* 字标落定后换回源 SVG 的整条路径（与源文件逐像素一致） */
  .zhAll { opacity: 0; animation: on .001s linear 5.02s forwards; }
  .enAll { opacity: 0; animation: on .001s linear 5.6s forwards; }

  @keyframes cam      { from { transform: scale(2.8); } to { transform: scale(1); } }
  @keyframes ringGrow { from { transform: translate(0px, 0px) scale(1); } to { transform: scale(1.6); } }
  @keyframes btnIn    { from { transform: scale(1.6); opacity: 0; } to { transform: scale(1.9); opacity: 1; } }
  @keyframes btnShrink{ from { transform: scale(1.9); } to { transform: scale(.9); } }
  @keyframes press    { 0%,100% { transform: scale(1); } 40% { transform: scale(.92); } }
  @keyframes ripple   { from { transform: scale(.2); opacity: .12; } to { transform: scale(1); opacity: 0; } }   /* 状态层限定在按钮圆内 */
  @keyframes cursorIn { from { transform: translate(110px, 60px); opacity: 0; } 40% { opacity: 1; } to { transform: translate(0, 0); opacity: 1; } }
  @keyframes cursorOut{ from { transform: translate(0, 0); opacity: 1; } to { transform: translate(16px, 12px); opacity: 0; } }
  @keyframes tap      { 0%,100% { transform: scale(1); } 45% { transform: scale(.86); } }
  @keyframes draw     { from { stroke-dashoffset: 1.02; } to { stroke-dashoffset: 0; } }
  @keyframes off      { to { opacity: 0; } }
  @keyframes cut      { from, to { opacity: 0; } }
  @keyframes on       { from, to { opacity: 1; } }
  @keyframes hold0    { from, to { opacity: 0; } }
  @keyframes fadeIn   { from { opacity: 0; } to { opacity: 1; } }
  @keyframes grow     { from { transform: scale(.72); } to { transform: scale(1); } }
  @keyframes center   { from { transform: translateX(256px); } to { transform: translateX(0); } }
  @keyframes rise     { from { transform: translateY(105%); } to { transform: translateY(0); } }
  @keyframes track    { from { transform: translateX(calc((var(--i) - 6) * 7px)); opacity: 0; filter: blur(3px); }
                        to   { transform: none; opacity: 1; filter: blur(0); } }
  .zh { transform-box: fill-box; }

  .controls { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px;
              padding: 6px; border-radius: 999px; background: color-mix(in srgb, var(--ink) 6%, transparent);
              backdrop-filter: blur(20px); }
  .controls button { font: 500 13px/1 inherit; letter-spacing: .01em; padding: 10px 18px; border: 0; border-radius: 999px;
                     background: transparent; color: var(--ink); cursor: pointer; transition: background .2s; }
  .controls button:hover { background: color-mix(in srgb, var(--ink) 10%, transparent); }
  body.capture .controls { display: none; }
  body.capture .stage { width: 51vw; }
  @media (prefers-reduced-motion: reduce) { svg * { animation-duration: .001s !important; animation-delay: 0s !important; } }
</style>
</head>
<body>
<div class="stage">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 782 256" role="img" aria-label="西几王传媒 XIJIWANG MEDIA">
  <defs>
    <clipPath id="zhWindow"><rect x="-10" y="-4" width="500" height="96"/></clipPath>
    <!-- 圆形展开遮罩，圆心 = 源 SVG 鼻子中心 (131.5,147) -->
    <mask id="thick" maskUnits="userSpaceOnUse" x="-100" y="-100" width="460" height="460"><path id="thickP" d="{{MANE_OUTER}}" fill="none" stroke="#fff" stroke-width="0" stroke-linejoin="round"/></mask>
  </defs>

  <g class="lockup">
   <g class="cam">
    <g class="ink" transform="translate(20 14) scale(.9)">
      <g class="reveal" mask="url(#thick)">
        <path class="maneP" fill-rule="evenodd" d="{{MANE}}"/>
        <path id="olFill" d="M0 0" style="display:none"/>   <!-- v3.5: 变形未完成时以当前轮廓为填充外缘，外缘永远在轮廓线中线上，杜绝白缝 -->
      </g>
      <g class="feat"><path d="{{EYES}}"/><path d="{{MOUTH}}"/></g>
      <path class="outline" d="M0 0"/>
      <path class="nose" d="{{NOSE}}"/>
      <g class="lionAll"><path fill-rule="evenodd" d="{{MANE}}"/><path d="{{EYES}}"/><path d="{{FACE}}"/></g>
    </g>
    <!-- 按钮原点 = 鼻子中心 (20+.9×131.5, 14+.9×147) -->
    <g class="ui" transform="translate(138.35 146.3)">
      <circle class="ripple" r="58"/>
      <g class="press">
        <g class="ringwrap"><g transform="rotate(-90)"><circle class="ring" r="58" pathLength="1"/></g></g>
        <g class="btn ink">
          <path class="barL" d="M-11.5 -10.5 Q-11.5 -13 -9 -13 L-6 -13 Q-3.5 -13 -3.5 -10.5 L-3.5 10.5 Q-3.5 13 -6 13 L-9 13 Q-11.5 13 -11.5 10.5 Z"/>
          <path class="bnose" d="{{NOSE_BTN}}"/>
          <path class="barR" d="M3.5 -10.5 Q3.5 -13 6 -13 L9 -13 Q11.5 -13 11.5 -10.5 L11.5 10.5 Q11.5 13 9 13 L6 13 Q3.5 13 3.5 10.5 Z"/>
        </g>
      </g>
      <!-- 指针：尖端落在右侧暂停条右下角之外，不遮挡形变 -->
      <g transform="translate(24 28)">
        <g class="cursor"><g class="tap">
          <path transform="scale(1.25)" d="M0 0 L0 17.5 L4.3 13.5 L7.2 20.2 L10 19 L7.1 12.4 L12.8 12.4 Z"
                fill="#fff" stroke="#111" stroke-width="1.1" stroke-linejoin="round"/>
        </g></g>
      </g>
    </g>
   </g>
  </g>

  <g class="ink" transform="translate(274 61)">
    <g clip-path="url(#zhWindow)">
{{ZH}}
    </g>
    <path class="zhAll" fill-rule="evenodd" d="{{ZHALL}}"/>
  </g>
  <g class="ink" transform="translate(274 167.9937)">
{{EN}}
    <path class="enAll" fill-rule="evenodd" d="{{ENALL}}"/>
  </g>
</svg>
</div>

<div class="controls">
  <button id="replay">重播</button>
  <button id="theme">浅色 / 深色</button>
</div>

<script>
  const LIVE = document.getAnimations();
  const UI = document.querySelector('.ui'), UI_END = 3300, END = 5700;
  /* “烘焙”：把当前动画值写成静态内联样式并移除动画——不走合成层重采样，
     画面与静态 SVG 同样锐利；终帧与源文件逐像素一致 */
  const PROPS = ['transform', 'opacity', 'stroke-dashoffset', 'filter'];
  const TARGETS = [...new Set(LIVE.map(a => a.effect.target))];
  const clear = () => TARGETS.forEach(e => PROPS.forEach(p => e.style.removeProperty(p)));
  const bake = () => {
    const vals = TARGETS.map(e => { const cs = getComputedStyle(e); return PROPS.map(p => cs.getPropertyValue(p)); });
    LIVE.forEach(a => a.cancel());
    TARGETS.forEach((e, i) => PROPS.forEach((p, j) => e.style.setProperty(p, vals[i][j])));
  };
  /* v3.2+ · JS 驱动：暂停条→鼻子形变 与 圆形展开半径（逐帧 setAttribute，Chrome / Safari / Firefox 通用） */
  const MORPH = {{MORPHJS}};
  const parse = d => { const n = d.match(/-?\d*\.?\d+(?:e-?\d+)?/g).map(Number); return { n, t: d.split(/-?\d*\.?\d+(?:e-?\d+)?/g) }; };
  const ML = MORPH.L.map(parse), MR = MORPH.R.map(parse);
  const BL = document.querySelector('.barL'), BR = document.querySelector('.barR'), TP = document.getElementById('thickP'), OF = document.getElementById('olFill'), MP = document.querySelector('.maneP'), OL = document.querySelector('.outline');
  const MANE_OUT = TP.getAttribute('d'), MANE_R = {{MANE_R}}, CX = 131.5, CY = 147;   // v3.5: 鬃毛外轮廓相对鼻心的径向采样（lion 局部单位）
  const lerpPath = (K, x) => {           // x ∈ [0,1]，关键帧之间线性（缓动已烘焙进关键帧）
    const f = x * (K.length - 1), i = Math.min(K.length - 2, Math.floor(f)), u = f - i, a = K[i], b = K[i + 1];
    let out = a.t[0]; for (let j = 0; j < a.n.length; j++) out += (+(a.n[j] + (b.n[j] - a.n[j]) * u).toFixed(4)) + a.t[j + 1];
    return out;
  };
  const cubic = (x1, y1, x2, y2) => x => {   // CSS cubic-bezier
    if (x <= 0) return 0; if (x >= 1) return 1; let s = x;
    for (let k = 0; k < 30; k++) { const X = 3*(1-s)**2*s*x1 + 3*(1-s)*s*s*x2 + s**3 - x, dX = 3*(1-s)**2*x1 + 6*(1-s)*s*(x2-x1) + 3*s*s*(1-x2);
      if (Math.abs(dX) < 1e-9) break; s = Math.min(1, Math.max(0, s - X / dX)); }
    return 3*(1-s)**2*s*y1 + 3*(1-s)*s*s*y2 + s**3;
  };
  const DECEL = cubic(.05, .7, .1, 1), EMPH = cubic(.2, 0, 0, 1), THK = cubic(.4, 0, .1, 1);   // v3.5: 加粗用缓入缓出，避免“一帧填满”   // v3.3: M3 decelerate（替代 expo，避免“爆开”）
  const M0 = 1450, MD = 600;                       // ❚❚→▶ 形变 1.45–2.05s
  const RG0 = 1900, RGD = 1600, H0 = 2000, HD = 450, F0 = 2200, FD = 700, OL_END = 2950;   // v3.5: 环放大(同 CSS ringGrow) · 交接/变形 · 加粗
  const clamp = v => Math.min(1, Math.max(0, v));
  const drive = ms => {
    const x = clamp((ms - M0) / MD);
    BL.setAttribute('d', lerpPath(ML, x) + ' ' + lerpPath(MR, x));   // 单一路径
    const s = 1 + .6 * EMPH(clamp((ms - RG0) / RGD));                   // = .ringwrap 当前缩放
    const rc = 58 * s / .9, w0 = 1.6 * s / .9;                          // 环在 lion 局部坐标中的半径与线宽
    const m = EMPH(clamp((ms - H0) / HD)), f = THK(clamp((ms - F0) / FD));
    if (ms < H0 || ms >= OL_END) { OL.style.display = 'none'; OF.style.display = 'none'; MP.style.display = ''; }
    else {
      OL.style.display = ''; const N = MANE_R.length; let d = '';
      for (let k = 0; k < N; k++) { const a = -Math.PI + 2 * Math.PI * k / N, r = rc + (MANE_R[k] - rc) * m;
        d += (k ? 'L' : 'M') + (CX + r * Math.cos(a)).toFixed(3) + ' ' + (CY + r * Math.sin(a)).toFixed(3); }
      OL.setAttribute('d', d + 'Z'); if (m < 1) TP.setAttribute('d', d + 'Z'); else if (TP.getAttribute('d') !== MANE_OUT) TP.setAttribute('d', MANE_OUT);   // 遮罩跟随变形中的轮廓，避免双线
      const pre = m < .96; OF.style.display = pre ? '' : 'none'; MP.style.display = pre ? 'none' : ''; if (pre) OF.setAttribute('d', d + 'Z');
      OL.setAttribute('stroke-width', (w0 * (1 - f)).toFixed(4));
    }
    TP.setAttribute('stroke-width', ms < F0 ? 0 : (w0 * (1 - f) + 220 * f).toFixed(3));   // 遮罩描边：从轮廓线宽向内加粗到整狮
  };
  const clock = () => { const a = LIVE[0]; return a && a.startTime != null ? document.timeline.currentTime - a.startTime : 0; };
  let raf; const loop = () => { const t = clock(); drive(t); if (t < END) raf = requestAnimationFrame(loop); };
  const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
  // 逐帧导出：seek(毫秒)
  window.seek = ms => { clearTimeout(timer); cancelAnimationFrame(raf); clear();   /* v3.3: 逐帧导出时取消实时播放的终帧定时器，避免其在 seek 与截图之间触发造成空白帧 */ LIVE.forEach(a => { a.pause(); a.currentTime = ms; }); bake(); drive(ms); UI.style.display = ms >= UI_END ? 'none' : ''; };
  // 实时播放：结束后定格
  let timer; const arm = () => { clearTimeout(timer); timer = setTimeout(() => { cancelAnimationFrame(raf); drive(END); bake(); UI.style.display = 'none'; }, END); };
  const start = () => { cancelAnimationFrame(raf); if (REDUCE) drive(END); else { drive(0); raf = requestAnimationFrame(loop); } };
  const replay = () => { clearTimeout(timer); clear(); UI.style.display = ''; LIVE.forEach(a => { a.cancel(); a.play(); }); start(); arm(); };
  start(); arm();
  document.getElementById('replay').onclick = replay;
  const applyHash = () => document.body.classList.toggle('dark', location.hash === '#dark');
  document.getElementById('theme').onclick = () => {
    const d = !document.body.classList.contains('dark');
    history.replaceState(null, '', d ? '#dark' : location.pathname + location.search);
    document.body.classList.toggle('dark', d);
  };
  window.addEventListener('hashchange', applyHash); applyHash();
</script>
</body>
</html>
