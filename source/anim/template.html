<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>西几王传媒 · Logo 动画</title>
<style>
  :root { --ink: #202624; --bg: #ffffff; --ease-pop: cubic-bezier(.34,1.56,.64,1); --ease-out: cubic-bezier(.16,1,.3,1); }
  body.dark { --ink: #f4f1ea; --bg: #141816; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); display: grid; place-items: center; font-family: system-ui, sans-serif; transition: background .4s; }
  .stage { width: min(92vw, 1100px); }
  svg { width: 100%; height: auto; display: block; overflow: visible; }
  svg [fill="currentColor"], svg .ink { fill: var(--ink); }
  svg * { transform-box: fill-box; transform-origin: center; }

  /* —— 狮子徽标 —— */
  .mane   { animation: mane 1s var(--ease-pop) both; }
  .ring   { fill: none; stroke: var(--ink); stroke-width: 3; transform-origin: 135px 126px; transform-box: view-box;
            opacity: 0; animation: ring 1s var(--ease-out) .45s forwards; }
  .eyes   { animation: eyesOpen .45s var(--ease-pop) .7s both, blink .28s ease-in-out 3.1s 1; }
  .nose   { animation: pop .55s var(--ease-pop) .85s both; }
  .mouth  { animation: mouth .5s var(--ease-out) 1s both; transform-origin: 50% 0; }

  /* —— 中文字标 —— */
  .zh { animation: rise .8s var(--ease-out) calc(1.1s + var(--i) * .09s) both; }
  /* —— 英文字标 —— */
  .en { animation: track .7s var(--ease-out) calc(1.75s + var(--i) * .035s) both; }
  /* —— 扫光 —— */
  .shine { animation: shine 1.1s ease-in-out 2.6s both; }

  @keyframes mane {
    0%   { transform: scale(0) rotate(-150deg); opacity: 0; }
    60%  { opacity: 1; }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }
  @keyframes ring {
    0%   { transform: scale(.6); opacity: .35; stroke-width: 6; }
    100% { transform: scale(1.7); opacity: 0; stroke-width: 1; }
  }
  @keyframes eyesOpen { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  @keyframes blink { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(.1); } }
  @keyframes pop { 0% { transform: scale(0); } 100% { transform: scale(1); } }
  @keyframes mouth { from { transform: scaleX(0); opacity: 0; } to { transform: scaleX(1); opacity: 1; } }
  @keyframes rise {
    0%   { transform: translateY(46px); opacity: 0; filter: blur(6px); }
    100% { transform: translateY(0);    opacity: 1; filter: blur(0); }
  }
  @keyframes track {
    0%   { transform: translateX(calc((var(--i) - 6) * 9px)); opacity: 0; }
    100% { transform: translateX(0); opacity: 1; }
  }
  @keyframes shine { from { transform: translateX(-160px) skewX(-20deg); } to { transform: translateX(640px) skewX(-20deg); } }

  .controls { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; }
  .controls button { font: 500 14px system-ui; padding: 8px 16px; border-radius: 999px; border: 1px solid var(--ink);
    background: transparent; color: var(--ink); cursor: pointer; opacity: .7; }
  .controls button:hover { opacity: 1; }
  body.capture .controls { display: none; }
  @media (prefers-reduced-motion: reduce) { svg * { animation: none !important; } }
</style>
</head>
<body>
<div class="stage">
<svg id="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 782 256" role="img" aria-label="西几王传媒 XIJIWANG MEDIA">
  <defs>
    <linearGradient id="shineGrad" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".75"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="zhClip">{{ZHCLIP}}</clipPath>
  </defs>

  <!-- 冲击波光环 -->
  <circle class="ring" cx="135" cy="126" r="100"/>

  <!-- 狮子徽标 -->
  <g class="ink" transform="translate(20 14) scale(.9)">
    <path class="mane"  fill-rule="evenodd" d="{{MANE}}"/>
    <path class="eyes"  d="{{EYES}}"/>
    <path class="nose"  d="{{NOSE}}"/>
    <path class="mouth" d="{{MOUTH}}"/>
  </g>

  <!-- 中文字标（逐字上浮） -->
  <g class="ink" transform="translate(274 61)">
{{ZH}}
    <g clip-path="url(#zhClip)"><rect class="shine" x="0" y="-10" width="70" height="110" fill="url(#shineGrad)"/></g>
  </g>

  <!-- 英文字标（字距收拢） -->
  <g class="ink" transform="translate(274 167.9937)">
{{EN}}
  </g>
</svg>
</div>

<div class="controls">
  <button id="replay">重播 Replay</button>
  <button id="theme">深色 / 浅色</button>
</div>

<script>
  // 重播：把所有动画拉回 0 再播放
  const replay = () => document.getAnimations().forEach(a => { a.cancel(); a.play(); });
  document.getElementById('replay').onclick = replay;
  document.getElementById('theme').onclick = () => document.body.classList.toggle('dark');
  // 导出视频用：?t=毫秒 可定格到任意时间点
  window.seek = ms => document.getAnimations().forEach(a => { a.pause(); a.currentTime = ms; });
</script>
</body>
</html>
