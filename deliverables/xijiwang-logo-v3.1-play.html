<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>西几王传媒 · Logo Motion v3.1</title>
<style>
  /* 缓动：Material 3 Emphasized + Apple ease-out-expo，无回弹 */
  :root {
    --ink: #202624; --bg: #ffffff;
    --emph:  cubic-bezier(.2, 0, 0, 1);
    --decel: cubic-bezier(.05, .7, .1, 1);
    --expo:  cubic-bezier(.16, 1, .3, 1);
    --soft:  cubic-bezier(.4, 0, .2, 1);
  }
  body.dark { --ink: #f5f5f7; --bg: #000000; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: var(--bg); display: grid; place-items: center; transition: background .5s var(--soft);
         font-family: -apple-system, "SF Pro Text", "Google Sans", system-ui, sans-serif; }
  body.capture { transition: none; }
  .stage { width: min(80vw, 980px); }
  svg { width: 100%; height: auto; display: block; overflow: visible; }
  svg * { transform-box: view-box; transform-origin: 0 0; }
  .ink { fill: var(--ink); }

  /* ── 0 · 暂停按钮（镜头 2.8× 对准鼻子） ── */
  .cam     { transform-origin: 138.35px 146.3px; animation: cam 1.6s var(--emph) 1.9s both; }
  .ring    { fill: none; stroke: var(--ink); stroke-width: 1.6; stroke-dasharray: 1.02 1.02; stroke-linecap: round;
             animation: draw .9s var(--soft) 0s both, off .35s var(--soft) 2.92s forwards; }
  .ringwrap{ animation: ringGrow .7s var(--emph) 1.9s forwards; }
  .btn     { animation: btnIn .7s var(--decel) .2s both, btnShrink .6s var(--emph) 1.9s forwards, cut .001s linear 2.5s forwards; }
  .press   { animation: press .32s var(--soft) 1.28s forwards; }
  .ripple  { fill: var(--ink); opacity: 0; animation: ripple .8s var(--decel) 1.40s forwards; }
  .barL    { animation: morphL .5s linear 1.45s forwards, cut .001s linear 1.95s forwards; }
  .barR    { animation: morphR .5s linear 1.45s forwards, cut .001s linear 1.95s forwards; }
  /* 两半在 1.95s 精确合拢后，硬切为同一几何的整体鼻子路径（无接缝） */
  .bnose   { opacity: 0; animation: on .001s linear 1.95s forwards; }
  .cursor  { opacity: 0; animation: cursorIn .7s var(--emph) .55s forwards, cursorOut .35s var(--soft) 1.42s forwards; }
  .cursor .tap { animation: tap .26s var(--soft) 1.30s forwards; }

  /* ── 1 · 狮子：鼻子硬切 + 圆形遮罩从鼻子展开 ── */
  .lockup  { animation: center 1.0s var(--emph) 3.3s both; }
  .nose    { animation: hold0 2.5s linear 0s, cut .001s linear 3.3s forwards; }
  .reveal  { animation: cut .001s linear 3.3s forwards; }
  /* 展开完成后换回源 SVG 的原始三条路径（结构与源文件一致） */
  .lionAll { opacity: 0; animation: on .001s linear 3.3s forwards; }            /* 0–2.5s 隐藏，之后回到基础值（可见） */
  #growC   { r: 128px; animation: grow .75s var(--emph) 2.52s backwards; }

  /* ── 2 · 字标 ── */
  .zh { animation: rise .95s var(--expo) calc(3.8s + var(--i) * .065s) both, cut .001s linear 5.02s forwards; }
  .en { animation: track 1.1s var(--expo) calc(4.15s + var(--i) * .028s) both, cut .001s linear 5.6s forwards; }
  /* 字标落定后换回源 SVG 的整条路径（与源文件逐像素一致） */
  .zhAll { opacity: 0; animation: on .001s linear 5.02s forwards; }
  .enAll { opacity: 0; animation: on .001s linear 5.6s forwards; }

  @keyframes cam      { from { transform: scale(2.8); } to { transform: scale(1); } }
  @keyframes ringGrow { from { transform: translate(0px, 0px) scale(1); } to { transform: translate(-3.15px, -20.9px) scale(1.6); } }
  @keyframes btnIn    { from { transform: scale(1.6); opacity: 0; } to { transform: scale(1.9); opacity: 1; } }
  @keyframes btnShrink{ from { transform: scale(1.9); } to { transform: scale(.9); } }
  @keyframes press    { 0%,100% { transform: scale(1); } 40% { transform: scale(.92); } }
  @keyframes ripple   { from { transform: scale(.2); opacity: .12; } to { transform: scale(1); opacity: 0; } }   /* 状态层限定在按钮圆内 */

<div class="controls">
  <button id="replay">重播</button>
  <button id="theme">浅色 / 深色</button>
</div>

<script>
  const LIVE = document.getAnimations();
  const UI = document.querySelector('.ui'), UI_END = 3300, END = 5700;
  /* “烘焙”：把当前动画值写成静态内联样式并移除动画——不走合成层重采样，
     画面与静态 SVG 同样锐利；终帧与源文件逐像素一致 */
  const PROPS = ['transform', 'opacity', 'd', 'r', 'stroke-dashoffset', 'filter'];
  const TARGETS = [...new Set(LIVE.map(a => a.effect.target))];
  const clear = () => TARGETS.forEach(e => PROPS.forEach(p => e.style.removeProperty(p)));
  const bake = () => {
    const vals = TARGETS.map(e => { const cs = getComputedStyle(e); return PROPS.map(p => cs.getPropertyValue(p)); });
    LIVE.forEach(a => a.cancel());
    TARGETS.forEach((e, i) => PROPS.forEach((p, j) => e.style.setProperty(p, vals[i][j])));
  };
  // 逐帧导出：seek(毫秒)
  window.seek = ms => { clear(); LIVE.forEach(a => { a.pause(); a.currentTime = ms; }); bake(); UI.style.display = ms >= UI_END ? 'none' : ''; };
  // 实时播放：结束后定格
  let timer; const arm = () => { clearTimeout(timer); timer = setTimeout(() => { bake(); UI.style.display = 'none'; }, END); };
  const replay = () => { clearTimeout(timer); clear(); UI.style.display = ''; LIVE.forEach(a => { a.cancel(); a.play(); }); arm(); };
  arm();
  document.getElementById('replay').onclick = replay;
  const applyHash = () => document.body.classList.toggle('dark', location.hash === '#dark');
  document.getElementById('theme').onclick = () => {
    const d = !document.body.classList.contains('dark');
    history.replaceState(null, '', d ? '#dark' : location.pathname + location.search);
    document.body.classList.toggle('dark', d);
  };
  window.addEventListener('hashchange', applyHash); applyHash();
</script>
